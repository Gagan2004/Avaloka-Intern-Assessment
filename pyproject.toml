[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alok-interview-solutions"
version = "0.1.0"
description = "High-performance implementations of LRU Cache and Event Scheduler with comprehensive tests and discussion."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Alok" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
